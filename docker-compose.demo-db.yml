# Base PostgreSQL de démo (PME sénégalaise fictive) avec journal d'audit pgaudit.
#
# Première utilisation ou changement d'image :
#   docker compose -f docker-compose.demo-db.yml down -v   # efface l'ancien volume (données fictives)
#   docker compose -f docker-compose.demo-db.yml up -d --build
#
# Lire le journal d'audit :
#   docker logs afrigrc-demo-db 2>&1 | grep "AUDIT:"
#
# Port 5433 pour ne pas entrer en conflit avec la base interne d'OpenMetadata.
services:
  demo-db:
    build: ./demo-db
    image: afrigrc-demo-db:16
    container_name: afrigrc-demo-db
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_change_me
      POSTGRES_DB: pme_sn
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=read,write,ddl,role
      - -c
      - pgaudit.log_parameter=off
      - -c
      - log_line_prefix=%m [%p] %u@%d 
    ports:
      - "5433:5432"
    volumes:
      - demo_db_data:/var/lib/postgresql/data
      - ./demo-db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  demo_db_data:
